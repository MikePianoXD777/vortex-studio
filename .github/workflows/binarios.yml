# Compila los binarios de Windows y Linux y los sube a la release.
#
# Corre solo al publicar una release: así cada versión trae sus ejecutables
# sin compilar nada a mano. El .exe no se puede compilar desde Linux —
# PyInstaller empaca el Python del sistema donde corre—, por eso cada binario
# sale de su propio sistema.
#
# Antes de subir nada, cada ejecutable se abre con --smoke-test: arma el
# editor completo sin pantalla. Un empaque al que le falte una biblioteca
# compila sin errores y truena al abrir; esto lo detiene aquí.
#
# También se puede lanzar a mano (Actions → Binarios → Run workflow) con el
# tag de una release que ya exista.

name: Binarios

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release a la que se suben los binarios (ej. v0.1.0b1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    # 22.04 y no la más nueva: el binario solo corre en sistemas con una glibc
    # igual o más nueva que la de donde se compiló.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          pip install ".[dev,pro]"

      - name: Compilar
        run: pyinstaller vortex-studio.spec --noconfirm --clean

      - name: Prueba de humo
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/vortex-studio/vortex-studio --smoke-test

      - name: Empaquetar
        run: |
          version="$(python -c 'import vortex_studio; print(vortex_studio.__version__)')"
          bash empaquetado/linux/empaquetar.sh "$version"

      - name: Subir a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/VortexStudio-*-linux-x86_64.tar.gz --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,pro]"

      - name: Compilar
        run: pyinstaller vortex-studio.spec --noconfirm --clean

      - name: Prueba de humo
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VORTEX_SMOKE_LOG: ${{ runner.temp }}\humo.log
        run: |
          $p = Start-Process -FilePath "dist\vortex-studio\vortex-studio.exe" `
               -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $env:VORTEX_SMOKE_LOG) { Get-Content $env:VORTEX_SMOKE_LOG }
            throw "La prueba de humo falló con código $($p.ExitCode)"
          }

      - name: Instalador y portátil
        shell: pwsh
        run: |
          $version = python -c "import vortex_studio; print(vortex_studio.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "empaquetado\windows\vortex-studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          Compress-Archive -Path "dist\vortex-studio" `
            -DestinationPath "dist\VortexStudio-$version-windows-x64-portable.zip"

      - name: Subir a la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG (Get-ChildItem dist\VortexStudio-*-windows-x64-*).FullName --clobber
