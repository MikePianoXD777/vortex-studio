# Compila los binarios de Windows y Linux y los sube a la release.
#
# Corre solo al publicar una release: así cada versión trae sus ejecutables
# sin compilar nada a mano. El .exe no se puede compilar desde Linux —
# PyInstaller empaca el Python del sistema donde corre—, por eso cada binario
# sale de su propio sistema.
#
# Antes de subir nada, cada ejecutable se abre con --smoke-test: arma el
# editor completo sin pantalla. Un empaque al que le falte una biblioteca
# compila sin errores y truena al abrir; esto lo detiene aquí.
#
# También se puede lanzar a mano (Actions → Binarios → Run workflow) con el
# tag de una release que ya exista.

name: Binarios

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release a la que se suben los binarios (ej. v0.1.0b1). Vacío: compila la rama y deja los binarios como artefactos, sin tocar ninguna release."
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Sin tag se compila el commit de la rama: sirve para probar los binarios
  # (y correr la revisión a fondo en Windows) antes de sacar versión.
  REF: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

jobs:
  linux:
    # 22.04 y no la más nueva: el binario solo corre en sistemas con una glibc
    # igual o más nueva que la de donde se compiló.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencias
        # libpulse0: el sonido de QtMultimedia enlaza libpulse, que no se
        # empaca porque todo escritorio con PulseAudio o PipeWire ya la trae.
        # La máquina de compilación no tiene sonido y sin ella la prueba de
        # humo truena al importar el reproductor de audio.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
          # Las de X11 que van dentro del paquete (ver empaquetado/bibliotecas_linux.py)
          # y un X virtual para probar que el editor abre sin ellas en el sistema.
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-util1 libxkbcommon-x11-0 xvfb xauth
          python -m pip install --upgrade pip
          pip install ".[dev,pro]"

      - name: Compilar
        env:
          VORTEX_STRICT_BUNDLE: "1"
        run: pyinstaller vortex-studio.spec --noconfirm --clean

      - name: Prueba de humo
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/vortex-studio/vortex-studio --smoke-test

      - name: Revisión a fondo
        # Usa el editor empacado de verdad: importa, exporta, guarda.
        env:
          QT_QPA_PLATFORM: offscreen
          VORTEX_SELFCHECK_LOG: ${{ runner.temp }}/revision.log
        run: |
          estado=0
          ./dist/vortex-studio/vortex-studio --self-check || estado=$?
          cat "$VORTEX_SELFCHECK_LOG" || true
          exit $estado

      - name: Abre en X11 sin las bibliotecas del sistema
        # Se quitan del sistema las bibliotecas de X11 que van en el paquete y
        # se abre el editor en un X virtual. Si alguna no viajó adentro, Qt no
        # carga su plugin de X11 y esto truena, igual que en el escritorio de
        # alguien que no las tiene.
        run: |
          sudo dpkg -r --force-depends libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-util1 libxkbcommon-x11-0
          xvfb-run -a env QT_QPA_PLATFORM=xcb ./dist/vortex-studio/vortex-studio --smoke-test

      - name: Empaquetar
        run: |
          version="$(python -c 'import vortex_studio; print(vortex_studio.__version__)')"
          bash empaquetado/linux/empaquetar.sh "$version"

      - name: Subir a la release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/VortexStudio-*-linux-x86_64.tar.gz --clobber

      - name: Guardar como artefacto (prueba, sin release)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/VortexStudio-*-linux-x86_64.tar.gz
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,pro]"

      - name: Compilar
        run: pyinstaller vortex-studio.spec --noconfirm --clean

      - name: Prueba de humo
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VORTEX_SMOKE_LOG: ${{ runner.temp }}\humo.log
        run: |
          $p = Start-Process -FilePath "dist\vortex-studio\vortex-studio.exe" `
               -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $env:VORTEX_SMOKE_LOG) { Get-Content $env:VORTEX_SMOKE_LOG }
            throw "La prueba de humo falló con código $($p.ExitCode)"
          }

      - name: Revisión a fondo
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VORTEX_SELFCHECK_LOG: ${{ runner.temp }}\revision.log
        run: |
          $p = Start-Process -FilePath "dist\vortex-studio\vortex-studio.exe" `
               -ArgumentList "--self-check" -Wait -PassThru
          if (Test-Path $env:VORTEX_SELFCHECK_LOG) { Get-Content $env:VORTEX_SELFCHECK_LOG }
          if ($p.ExitCode -ne 0) { throw "La revisión a fondo falló con código $($p.ExitCode)" }

      - name: Instalador y portátil
        shell: pwsh
        run: |
          $version = python -c "import vortex_studio; print(vortex_studio.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "empaquetado\windows\vortex-studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          Compress-Archive -Path "dist\vortex-studio" `
            -DestinationPath "dist\VortexStudio-$version-windows-x64-portable.zip"

      - name: Subir a la release
        if: env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG (Get-ChildItem dist\VortexStudio-*-windows-x64-*).FullName --clobber

      - name: Guardar como artefacto (prueba, sin release)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/VortexStudio-*-windows-x64-*
          retention-days: 7
